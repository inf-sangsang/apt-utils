<body class="apt-tool-page">
    <div class="apt-title-bar">
        <nav class="apt-site-nav" aria-label="사이트 탐색">
            <a class="apt-home-link" href="../index.html"><svg class="apt-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h5v-6h3v6h5V9"/></svg><span>APT Utils 홈으로</span></a>
        </nav>
        <h1>지하철 이용량 비교</h1>
    </div>
  <main>
    <header class="page-header">
      <div>
      <p>궁금한 역을 찾아 담고, 출퇴근 흐름을 한눈에 비교하세요.</p></div>
      <div class="dataset-tag">수도권 <strong>752</strong>개 역·호선</div>
    </header>

    <section class="panel" aria-labelledby="search-title">
      <div class="section-heading"><div><span class="eyebrow">01 / SEARCH</span><h2 id="search-title">역 검색</h2></div><span id="result-count" class="count"></span></div>
      <div class="search-bar">
        <label class="search-field"><span class="sr-only">역명, 지역명 또는 호선 검색</span><input id="search" type="search" placeholder="역명 · 지역명 · 호선 검색 (예: 동대문구)" autocomplete="off"></label>
        <label><span class="sr-only">호선 선택</span><select id="line"><option value="">전체 호선</option></select></label>
        <button id="merge-lines" class="line-switch" type="button" role="switch" aria-checked="false" aria-label="호선 통합">
          <span class="split-label">호선별 분리</span><span class="merged-label">호선 통합</span>
        </button>
      </div>
      <div class="table-wrap search-results"><table id="search-table"><caption class="sr-only">검색한 지하철역 이용량</caption><thead></thead><tbody></tbody></table></div>
      <div class="table-footer"><span>체크한 뒤 담거나, 행의 ‘담기’를 누르세요.</span><span id="merge-note">같은 이름의 역은 호선별로 구분합니다.</span></div>
    </section>

    <div class="connector">
      <button id="add-checked" class="primary" disabled>선택한 역 담기 <span id="checked-count">0</span> ↓</button>
    </div>

    <section class="panel selected-panel" aria-labelledby="selected-title">
      <div class="section-heading"><div><span class="eyebrow">02 / COMPARE</span><h2 id="selected-title">내가 담은 역 <span id="selected-count" class="count">0</span></h2></div><button id="clear" class="quiet" disabled>전체 비우기</button></div>
      <div class="table-wrap"><table id="selected-table"><caption class="sr-only">선택한 지하철역 비교</caption><thead></thead><tbody></tbody></table></div>
      <div class="table-footer"><span id="save-note">담은 역은 이 브라우저에 자동 저장됩니다.</span><span>열 제목을 누르면 정렬됩니다.</span></div>
    </section>
    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  </main>
